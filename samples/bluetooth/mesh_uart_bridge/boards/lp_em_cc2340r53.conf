# Board-specific RAM overlay for lp_em_cc2340r53 (CC2340R53, 64 KB SRAM)
#
# Zephyr 4.4 uses ~8 KB more RAM than 3.7 on this board — without this file
# the sample overflows by 1,210 B and fails to link.
#
# Applied automatically by west build when targeting lp_em_cc2340r53.
# Do NOT use -DEXTRA_CONF_FILE with this file — it is picked up automatically.
#
# See ble-zephyr-extra/doc/mesh-ram-zephyr37-vs-44.md for full analysis.
#
# ===== HCI TX stack (saves ~512 B) =========================================
# HCI TX thread only moves packets to the controller — it does NOT call
# PSA/MbedTLS crypto. Safe to reduce. Requires unlock flag.
# (Already used by mesh_provisioner's prj.conf.)
CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_BT_HCI_TX_STACK_SIZE=1024

# ===== Buffer reductions — MUST be applied together (~2,868 B saved) =======
# These four settings share the Zephyr net_buf pool. Applying any subset
# causes "Bluetooth init failed (err -5)" or "Initializing mesh failed
# (err -5)" because one subsystem exhausts the pool before another can
# claim its allocation at init time. All four must be set simultaneously.
CONFIG_BT_MESH_RELAY_BUF_COUNT=20
CONFIG_BT_MESH_FRIEND_QUEUE_SIZE=8
CONFIG_BT_BUF_EVT_RX_COUNT=8
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=12

# ===== Mesh DFU metadata (~90 B saved) =====================================
# Restores 3.7 default. Only limits firmware ID string length in DFU
# metadata — no impact on BT init, mesh init, or crypto.
CONFIG_BT_MESH_DFU_FWID_MAXLEN=16

# ===== Shell savings (~640 B saved) ========================================
# SHELL_HISTORY=n: disables 512 B history ring buffer.
# SHELL_CMD_BUFF_SIZE=128: halves command input buffer (256->128 B).
# Neither has any BT or mesh impact.
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_CMD_BUFF_SIZE=128

# ===== DO NOT reduce these stacks ==========================================
# All stack reductions caused hard faults on CC2340R53 (Cortex-M0+).
# Root cause: MbedTLS PSA SHA-256 (mbedtls_internal_sha256_process,
# confirmed via addr2line lr=0x00028bbc → sha256.c:490) runs in multiple
# threads: main, BT MESH WQ, BT RX WQ, shell_uart. Cortex-M0+ has only
# 8 usable registers (vs 13 on M33) so the compiler spills more locals
# to the stack — SHA-256 uses ~900 B on M0+ vs ~400 B on M33.
#
# Confirmed unsafe (tested value → fault PC):
#   MAIN_STACK_SIZE=1024        → 0x0002467c (crashes before shell prompt)
#   BT_TX_PROCESSOR_STACK_SIZE=768 → 0x73f1d7fe
#   BT_MESH_ADV_STACK_SIZE=1024 → 0x73f1d7fe
#   BT_MESH_ADV_STACK_SIZE=1280 → 0x72248416
#   BT_RX_STACK_SIZE=2600       → 0x1b2a8258
#   SHELL_STACK_SIZE=1536       → 0x441352b4
